
name: Build and Publish SKAPADEN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: |
          cd skapaden-updated
          npm install
          test -f www/index.html
          npx cap sync android

      - name: Build Android APK
        run: |
          cd skapaden-updated
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SKAPADEN-APK
          path: skapaden-updated/android/app/build/outputs/apk/debug/app-debug.apk

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Upload web files
        uses: actions/upload-pages-artifact@v3
        with:
          path: skapaden-updated/www

      - name: Publish SKAPADEN
        uses: actions/deploy-pages@v4

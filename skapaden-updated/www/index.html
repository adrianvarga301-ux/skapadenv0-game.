
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#08051d">
  <meta name="description" content="SKAPADEN - Superhero Bird">
  <title>SKAPADEN - Superhero Bird</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header>
    <div class="stat">🪙 <span id="coins">0</span></div>
    <div class="stat">💎 <span id="gems">0</span></div>
    <div class="stat">🏆 <span id="best">0</span></div>
    <button id="sound">🔊 ON</button>
  </header>

  <canvas id="game" width="600" height="760"></canvas>

  <div class="controls">
    <button class="green" id="start">▶ START</button>
    <button id="pause">Ⅱ PAUZĂ</button>
    <button id="retry">↻ REVINO</button>
    <button id="shop">🎁 MAGAZIN COSTUME</button>
  </div>

  <div class="extras">
    <button id="dailyButton">🎁 RECOMPENSĂ +100</button>
    <button id="missionButton">🏆 MISIUNE 20 MONEDE</button>
  </div>

  <p id="dailyNotice"></p>
  <p id="missionNotice">Colectează 20 de monede pentru 150 bonus!</p>
  <div id="message">Atinge START ca să începi!</div>
</main>

<section id="shopModal">
  <div class="shopbox">
    <div class="shophead">
      <span>🎁 MAGAZIN COSTUME</span>
      <button id="closeShop">✕</button>
    </div>
    <p id="shopNotice"></p>
    <div id="skinList"></div>
  </div>
</section>

<script src="game.js"></script>
<script src="skapaden-visual-upgrade.js"></script>
</body>
</html>
